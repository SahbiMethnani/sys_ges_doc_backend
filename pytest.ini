[pytest]
# =============================================================
# pytest.ini — Configuration Pytest pour sys_ges_doc_backend
# =============================================================

# Dossier racine des tests
testpaths = tests

# Découverte automatique des fichiers de test
python_files   = test_*.py
python_classes = Test*
python_functions = test_*

# Affichage verbose par défaut
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# Marqueurs personnalisés
markers =
    unit:        Tests unitaires (rapides, sans I/O externe)
    integration: Tests d'intégration (nécessitent LanceDB, fichiers réels)
    slow:        Tests lents (chargement de modèles ML)
    api:         Tests des endpoints FastAPI (TestClient, mocks)

# Variables d'environnement injectées pendant les tests
# (évite de toucher au vrai .env)
env =
    LLM_MODEL=mistral
    LLM_BASE_URL=http://localhost:11434
    LLM_TEMPERATURE=0.1
    EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
    EMBEDDING_DEVICE=cpu
    LANCE_DB_PATH=./test_lance_db
    LANCE_TABLE_NAME=documents
    DOCUMENTS_FOLDER=./test_documents

omit =
    DbReaderApp.py
    LanceDbReader.py
    viewer.py
    Test_installation.py
