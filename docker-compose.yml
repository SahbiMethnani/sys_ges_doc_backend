# Déprécié — utilisez le docker-compose à la racine du projet PFE :
#   cd .. && docker compose up --build -d
#
# Ce fichier conserve une stack minimale (LDAP + API) pour compatibilité.

services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: sys-ges-doc-ldap
    environment:
      LDAP_ORGANISATION: SysGesDoc
      LDAP_DOMAIN: sysgesdoc.local
      LDAP_ADMIN_PASSWORD: admin
    ports:
      - "389:389"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: sys-ges-doc-ldap-ui
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8081:80"
    depends_on:
      - openldap

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-api:local
    container_name: rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - openldap
    volumes:
      - ./documents:/app/documents
      - ./lance_db:/app/lance_db
      - hf_cache:/root/.cache/huggingface

volumes:
  hf_cache:
  ldap_data:
  ldap_config:
